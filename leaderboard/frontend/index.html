<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard Test</title>
  <style>
    :root {
      --bg: #121417;
      --surface: #1b1f24;
      --border: #2c333d;
      --text: #d8dee9;
      --muted: #8b95a5;
      --accent: #5e81ac;
      --accent-hover: #6e92bd;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
    }

    h1 {
      margin-top: 0;
      font-size: 1.4rem;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 110px auto;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    input, button {
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
    }

    button {
      background: var(--accent);
      border-color: var(--accent);
      color: #edf1f7;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover { background: var(--accent-hover); }

    #result-banner {
      min-height: 1.5rem;
      margin-bottom: 1rem;
      font-size: 0.95rem;
      color: var(--muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 0.55rem 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    th { color: var(--muted); font-weight: 600; font-size: 0.85rem; }
    td:last-child, th:last-child { text-align: right; }
  </style>
</head>
<body>
  <main>
    <h1>Top 10 Leaderboard</h1>

    <form id="score-form">
      <input type="text" id="name-input" placeholder="Player name" maxlength="25" required />
      <input type="number" id="score-input" placeholder="Score" step="0.01" required />
      <button type="submit">Submit</button>
    </form>

    <div id="result-banner">Loading scores...</div>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </main>

  <script>
    // Replace with your Render URL once deployed (e.g., "https://your-app.onrender.com")
    const API_URL = "https://researchandtest.onrender.com/";

    const form = document.getElementById("score-form");
    const nameInput = document.getElementById("name-input");
    const scoreInput = document.getElementById("score-input");
    const banner = document.getElementById("result-banner");
    const tbody = document.getElementById("leaderboard-body");

    function renderTable(entries) {
      tbody.innerHTML = "";
      if (entries.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="color: var(--muted);">No scores yet.</td></tr>`;
        return;
      }

      entries.forEach((entry, idx) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${idx + 1}</td>
          <td></td>
          <td>${entry.score}</td>
        `;
        // Use textContent for user-submitted names to prevent XSS
        row.children[1].textContent = entry.name;
        tbody.appendChild(row);
      });
    }

    async function loadLeaderboard() {
      try {
        const res = await fetch(`${API_URL}/api/leaderboard`);
        const data = await res.json();
        renderTable(data.leaderboard);
        banner.textContent = "";
      } catch (err) {
        banner.textContent = "Could not reach backend (if on Render, it may be waking up).";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      banner.textContent = "Submitting...";

      try {
        const res = await fetch(`${API_URL}/api/leaderboard`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: nameInput.value,
            score: Number(scoreInput.value)
          })
        });

        const data = await res.json();
        if (!res.ok) {
          banner.textContent = data.error || "Submission failed.";
          return;
        }

        renderTable(data.leaderboard);

        if (data.made_top_ten) {
          banner.textContent = `Nice! ${nameInput.value} placed #${data.rank}.`;
        } else {
          banner.textContent = `${nameInput.value} placed #? (outside the top 10).`;
        }

        form.reset();
      } catch (err) {
        banner.textContent = "Network error submitting score.";
      }
    });

    loadLeaderboard();
  </script>
</body>
</html>
