<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard Test</title>
  <link rel="stylesheet" href="index.css">
  <script src="index.js" defer></script>
</head>
<body>
  <main>
    <h1>Top 10 Leaderboard</h1>

    <form id="score-form">
      <input type="text" id="name-input" placeholder="Player name" maxlength="25" required />
      <input type="number" id="score-input" placeholder="Score" step="0.01" required />
      <button type="submit">Submit</button>
    </form>

    <div id="result-banner">Loading scores...</div>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </main>
</body>
</html>
